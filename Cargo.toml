# `cargo-features` is accepted only by nightly cargo and turns the whole manifest into a hard error on
# stable ("the `cargo-features` key ... is only allowed on the nightly channel"). The 2024 edition has
# been stable since Rust 1.85, so the gate is obsolete and only blocks stable builds and stable CI.
[package]
name = "ambient-auction-interface"
authors = ["Engineering <engineering@ambientcrypto.ai>"]
version = "0.1.0"
# Taken from this repository's own `git remote -v`.
repository = "https://github.com/ambient-xyz/auction-interface"
# Without a license field, `cargo package`/`cargo publish` refuse to build the crate and license-audit
# tooling classifies it as unlicensed. Matches the value used by every sibling crate that declares one.
license = "Proprietary"
homepage = "https://ambient.xyz"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = "=0.9.2"
ambient-auction-api = { git = "https://github.com/ambient-xyz/auction-api", rev = "0fcb946eb13aaf031fa173574648c14eed19a665" }
five8_const = "1.0.0"

[features]
global-config = ["ambient-auction-api/global-config"]
default = []
